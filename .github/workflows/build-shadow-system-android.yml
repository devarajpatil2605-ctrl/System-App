name: Build Shadow System Android APK

on:
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Verify web app and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default includes the removed legacy "tools" package,
          # which makes sdkmanager exit 1 on current Android SDK repositories.
          packages: "platform-tools"

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        run: npm run build

      - name: Smoke-check generated bundle
        run: npm test

      - name: Generate Android wrapper when absent
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor assets and plugins
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: shadow-system-dev-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
